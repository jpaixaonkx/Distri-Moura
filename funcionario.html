<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moura - Painel Funcionário</title>
    <!-- Fontes e Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS RESPONSIVO (PADRÃO 3D MOURA) -->
    <style>
        :root {
            --bg-dark: #071022; 
            --azul-primario: #0044cc;
            --azul-secundario: #001a4d;
            --amarelo-moura: #FFCC00;
            --amarelo-escuro: #ccaa00;
            --branco: #ffffff;
            --texto-claro: #e0e7ff;
        }

        * {
            box-sizing: border-box;
        }

        body.funcionario-bg {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--azul-secundario) 100%);
            color: var(--branco);
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        /* Layout Principal */
        .dashboard-layout {
            display: flex;
            height: 100vh;
            padding: 15px;
            gap: 20px;
            box-sizing: border-box;
            position: relative;
        }

        /* Sidebar com Efeito 3D */
        .sidebar-3d {
            width: 260px;
            background: rgba(0, 26, 77, 0.85);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 10px 15px 35px rgba(0, 0, 0, 0.4);
            clip-path: polygon(0 0, 100% 0, 88% 100%, 0% 100%);
            border-right: 4px solid var(--amarelo-moura);
            padding-right: 35px;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .btn-icon {
            background: transparent;
            border: none;
            color: var(--amarelo-moura);
            font-size: 24px;
            cursor: pointer;
        }

        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 99;
        }

        .menu-items {
            display: flex;
            flex-direction: column;
            gap: 15px;
            flex: 1;
        }

        .menu-btn {
            width: 100%;
            background: transparent;
            color: var(--texto-claro);
            border: none;
            padding: 14px 18px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-size: 15px;
            font-weight: 600;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .menu-btn:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateX(5px);
        }

        .menu-btn.active {
            background: var(--azul-primario);
            color: var(--branco);
            box-shadow: 0 5px 0 var(--azul-secundario), 0 10px 20px rgba(0, 68, 204, 0.5);
            transform: translateY(-2px);
        }

        /* Área Principal */
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            width: 100%;
        }

        .secao-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .secao-header h1 {
            font-size: 22px;
            margin: 0;
        }

        .user-profile {
            background: rgba(255,255,255,0.1);
            padding: 8px 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 14px;
            color: var(--amarelo-moura);
            border: 1px solid rgba(255, 204, 0, 0.2);
        }

        /* Cards e Layout 3D */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 25px;
        }

        .card-3d {
            background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02));
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 25px;
            display: flex;
            align-items: center;
            gap: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2), inset 0 2px 2px rgba(255, 255, 255, 0.1);
        }

        .card-icon {
            width: 55px;
            height: 55px;
            border-radius: 14px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            background: var(--amarelo-moura);
            color: #000;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.4);
            flex-shrink: 0;
        }

        .card-info h3 { margin: 0; font-size: 14px; font-weight: 400; color: #a3b8cc; }
        .card-info .valor { font-size: 26px; font-weight: 700; display: block; margin-top: 5px; color: var(--amarelo-moura); }

        /* Botões e Inputs 3D */
        .btn-3d {
            padding: 12px 20px;
            border: none;
            border-radius: 12px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s ease;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-amarelo {
            background: var(--amarelo-moura);
            color: var(--bg-dark);
            box-shadow: 0 6px 0 var(--amarelo-escuro), 0 10px 20px rgba(0,0,0,0.3);
        }
        .btn-amarelo:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 var(--amarelo-escuro), 0 4px 10px rgba(0,0,0,0.3);
        }
        .btn-vermelho {
            background: #ff4d4d;
            color: #fff;
            box-shadow: 0 6px 0 #cc0000, 0 10px 20px rgba(0,0,0,0.3);
        }
        .btn-vermelho:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 #cc0000, 0 4px 10px rgba(0,0,0,0.3);
        }

        .input-3d {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            border: none;
            background: rgba(255,255,255,0.05);
            color: var(--branco);
            box-shadow: inset 0 4px 6px rgba(0,0,0,0.3);
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            font-size: 15px;
        }
        .input-3d:focus { outline: 2px solid var(--amarelo-moura); }
        select.input-3d option { background: var(--bg-dark); color: var(--branco); }

        /* Tabelas */
        .table-container {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.05);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            overflow-x: auto;
        }
        .tabela-moderna { width: 100%; border-collapse: collapse; text-align: left; min-width: 500px; }
        .tabela-moderna th { padding: 12px; border-bottom: 2px solid var(--amarelo-moura); color: var(--amarelo-moura); font-size: 14px; }
        .tabela-moderna td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        .badge-blue { background: var(--azul-primario); padding: 4px 12px; border-radius: 20px; font-weight: bold; font-size: 11px;}

        /* Status Caixa Badge */
        .badge-status { padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 12px; display: inline-block; }
        .status-aberto { background: #28a745; color: #fff; box-shadow: 0 0 10px rgba(40,167,69,0.5); }
        .status-fechado { background: #dc3545; color: #fff; box-shadow: 0 0 10px rgba(220,53,69,0.5); }

        /* FAB - Botão Flutuante de Venda */
        .fab-3d {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(145deg, var(--amarelo-moura), #e6b800);
            color: var(--bg-dark);
            font-size: 24px;
            border: none;
            cursor: pointer;
            box-shadow: 0 6px 0 var(--amarelo-escuro), 0 10px 20px rgba(255, 204, 0, 0.3), inset 0 2px 2px rgba(255,255,255,0.6);
            transition: all 0.15s ease;
            z-index: 90;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .fab-3d:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 var(--amarelo-escuro), 0 4px 10px rgba(255, 204, 0, 0.3);
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .modal-content {
            background: #0d1b3a;
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 20px;
            padding: 25px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            position: relative;
        }
        .modal-close {
            position: absolute;
            top: 15px; right: 20px;
            background: transparent; border: none;
            color: var(--amarelo-moura); font-size: 20px;
            cursor: pointer;
        }

        .secao { display: none; animation: fadeIn 0.4s ease; }
        .secao.ativa { display: block; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 768px) {
            .dashboard-layout { padding: 10px; flex-direction: column; }
            .sidebar-3d {
                position: fixed; top: 0; left: -280px; height: 100vh; width: 260px;
                clip-path: none; border-right: 4px solid var(--amarelo-moura);
                padding-right: 20px; z-index: 1000; transition: left 0.3s ease;
            }
            .sidebar-3d.mobile-open { left: 0; }
            .sidebar-overlay.active { display: block; }
        }
    </style>
</head>
<body class="funcionario-bg">
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleMobileMenu()"></div>

    <div class="dashboard-layout">
        
        <!-- Sidebar do Colaborador -->
        <aside class="sidebar-3d" id="sidebar">
            <div class="sidebar-header">
                <span style="font-weight: 700; color: var(--amarelo-moura); font-size: 18px;">Painel Caixa</span>
                <button class="btn-icon" onclick="toggleMobileMenu()"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="menu-items">
                <button class="menu-btn active" onclick="mostrarSecao('dashboard', this)">
                    <i class="fas fa-cash-register"></i> <span>Meu Caixa</span>
                </button>
                <button class="menu-btn" onclick="mostrarSecao('estoque', this)">
                    <i class="fas fa-boxes"></i> <span>Consultar Estoque</span>
                </button>
            </div>

            <div>
                <button class="menu-btn" style="color: #ff6b6b;" onclick="sairSistema()">
                    <i class="fas fa-sign-out-alt"></i> <span>Sair</span>
                </button>
            </div>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main-content">
            <div style="margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center;">
                <button class="btn-3d btn-amarelo" style="padding: 8px 12px;" onclick="toggleMobileMenu()">
                    <i class="fas fa-bars"></i> Menu
                </button>
                <!-- Identificação Clara do Funcionário Logado -->
                <div class="user-profile">
                    <i class="fas fa-user-tie"></i> <span id="nome-usuario-logado">Carregando...</span>
                </div>
            </div>

            <!-- SEÇÃO 1: CAIXA INDIVIDUAL -->
            <section id="dashboard" class="secao ativa">
                <header class="secao-header">
                    <h1>Gerenciamento de Caixa Individual</h1>
                    <div id="status-caixa-container">
                        <span id="badge-status-caixa" class="badge-status status-fechado">CAIXA FECHADO</span>
                    </div>
                </header>

                <!-- Ações de Abertura / Fechamento de Caixa -->
                <div style="margin-bottom: 25px; display: flex; gap: 15px; flex-wrap: wrap;">
                    <button id="btn-abrir-caixa" class="btn-3d btn-amarelo" onclick="abrirModalAbrirCaixa()">
                        <i class="fas fa-unlock"></i> Abrir Caixa
                    </button>
                    <button id="btn-fechar-caixa" class="btn-3d btn-vermelho" onclick="fecharCaixaFuncionario()" style="display: none;">
                        <i class="fas fa-lock"></i> Fechar Caixa
                    </button>
                </div>

                <div class="cards-grid">
                    <div class="card-3d">
                        <div class="card-icon"><i class="fas fa-calendar-day"></i></div>
                        <div class="card-info">
                            <h3>Vendas de Hoje (Seu Caixa)</h3>
                            <span class="valor" id="caixa-dia">R$ 0,00</span>
                        </div>
                    </div>
                    <div class="card-3d">
                        <div class="card-icon"><i class="fas fa-calendar-week"></i></div>
                        <div class="card-info">
                            <h3>Vendas da Semana</h3>
                            <span class="valor" id="caixa-semana">R$ 0,00</span>
                        </div>
                    </div>
                    <div class="card-3d">
                        <div class="card-icon"><i class="fas fa-calendar-alt"></i></div>
                        <div class="card-info">
                            <h3>Vendas do Mês</h3>
                            <span class="valor" id="caixa-mes">R$ 0,00</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- SEÇÃO 2: ESTOQUE (Tempo Real) -->
            <section id="estoque" class="secao">
                <header class="secao-header">
                    <h1>Estoque em Tempo Real</h1>
                </header>
                <div class="table-container">
                    <table class="tabela-moderna">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Produto</th>
                                <th>Qtd Disponível</th>
                                <th>Preço Venda</th>
                            </tr>
                        </thead>
                        <tbody id="lista-estoque-funcionario">
                            <!-- Preenchido via Supabase em tempo real -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <!-- Botão Flutuante (PDV) para Lançar Vendas -->
        <button id="btn-pdv" class="fab-3d" title="Lançar Venda" onclick="abrirModalVenda()">
            <i class="fas fa-plus"></i>
        </button>

        <!-- Modal de Abertura de Caixa -->
        <div class="modal-overlay" id="modal-abrir-caixa">
            <div class="modal-content">
                <button class="modal-close" onclick="fecharModalAbrirCaixa()">&times;</button>
                <h2 style="margin-top: 0; font-size: 20px; color: var(--amarelo-moura);">Abrir Caixa do Dia</h2>
                <form onsubmit="confirmarAberturaCaixa(event)">
                    <div style="margin-bottom: 20px;">
                        <label style="font-size: 13px; color: #a3b8cc;">Valor Inicial em Dinheiro (Troco)</label>
                        <input type="number" step="0.01" id="valor-troco-inicial" class="input-3d" min="0" value="0.00" required style="margin-top: 5px;">
                    </div>
                    <button type="submit" class="btn-3d btn-amarelo" style="width: 100%; justify-content: center;">Iniciar Operação de Caixa</button>
                </form>
            </div>
        </div>

        <!-- Modal de Nova Venda (PDV Integrado) -->
        <div class="modal-overlay" id="modal-venda">
            <div class="modal-content">
                <button class="modal-close" onclick="fecharModalVenda()">&times;</button>
                <h2 style="margin-top: 0; font-size: 20px; color: var(--amarelo-moura);">Lançar Nova Venda (PDV)</h2>
                <form id="form-venda-func" onsubmit="realizarVendaFuncionario(event)">
                    <div style="margin-bottom: 15px;">
                        <label style="font-size: 13px; color: #a3b8cc;">Selecione o Produto</label>
                        <select id="venda-produto" class="input-3d" required style="margin-top: 5px;">
                            <option value="">Carregando produtos...</option>
                        </select>
                    </div>
                    <div style="margin-bottom: 15px;">
                        <label style="font-size: 13px; color: #a3b8cc;">Quantidade</label>
                        <input type="number" id="venda-qtd" class="input-3d" min="1" value="1" required style="margin-top: 5px;">
                    </div>
                    <div style="margin-bottom: 20px;">
                        <label style="font-size: 13px; color: #a3b8cc;">Forma de Pagamento</label>
                        <select id="venda-pagamento" class="input-3d" required style="margin-top: 5px;">
                            <option value="pix">PIX</option>
                            <option value="cartao">Cartão (Crédito/Débito)</option>
                            <option value="dinheiro">Dinheiro</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-3d btn-amarelo" style="width: 100%; justify-content: center;">Confirmar Venda</button>
                </form>
            </div>
        </div>

    </div>

    <!-- Scripts Supabase e Lógica -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    
    <script>
        // Variáveis de Sessão do Funcionário
        let funcionarioLogado = null;

        function verificarSessao() {
            // Recupera o funcionário salvo no localStorage durante o login
            const funcSalvo = localStorage.getItem('funcionario_logado');
            if (funcSalvo) {
                funcionarioLogado = JSON.parse(funcSalvo);
                document.getElementById('nome-usuario-logado').innerText = funcionarioLogado.nome || funcionarioLogado.email;
            } else {
                // Caso não esteja logado, define um padrão temporário para testes ou redireciona
                funcionarioLogado = { id: 1, nome: 'Colaborador Padrão', email: 'colaborador@moura.com' };
                document.getElementById('nome-usuario-logado').innerText = funcionarioLogado.nome;
            }
        }

        function mostrarSecao(idSecao, elementoBotao) {
            document.querySelectorAll('.secao').forEach(secao => secao.classList.remove('ativa'));
            document.querySelectorAll('.menu-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(idSecao).classList.add('ativa');
            if (elementoBotao) elementoBotao.classList.add('active');

            if (window.innerWidth <= 768) {
                toggleMobileMenu();
            }
        }

        function toggleMobileMenu() {
            document.getElementById('sidebar').classList.toggle('mobile-open');
            document.getElementById('sidebar-overlay').classList.toggle('active');
        }

        function abrirModalVenda() {
            const caixaAberto = localStorage.getItem(`caixa_aberto_${funcionarioLogado.id}`);
            if (!caixaAberto || caixaAberto === 'false') {
                alert('Você precisa abrir o seu caixa antes de realizar vendas!');
                return;
            }
            document.getElementById('modal-venda').style.display = 'flex';
            carregarProdutosSelect();
        }

        function fecharModalVenda() {
            document.getElementById('modal-venda').style.display = 'none';
        }

        function abrirModalAbrirCaixa() {
            document.getElementById('modal-abrir-caixa').style.display = 'flex';
        }

        function fecharModalAbrirCaixa() {
            document.getElementById('modal-abrir-caixa').style.display = 'none';
        }

        function sairSistema() {
            if(confirm('Deseja realmente sair do painel?')) {
                localStorage.removeItem('funcionario_logado');
                window.location.href = 'index.html';
            }
        }

        // --- CONTROLE DE CAIXA ---
        function confirmarAberturaCaixa(event) {
            event.preventDefault();
            const troco = document.getElementById('valor-troco-inicial').value;
            localStorage.setItem(`caixa_aberto_${funcionarioLogado.id}`, 'true');
            localStorage.setItem(`caixa_troco_${funcionarioLogado.id}`, troco);
            
            alert('Caixa aberto com sucesso!');
            fecharModalAbrirCaixa();
            atualizarStatusCaixaUI();
        }

        function fecharCaixaFuncionario() {
            if(confirm('Tem certeza que deseja fechar o seu caixa e encerrar os lançamentos do dia?')) {
                localStorage.setItem(`caixa_aberto_${funcionarioLogado.id}`, 'false');
                alert('Caixa fechado com sucesso.');
                atualizarStatusCaixaUI();
            }
        }

        function atualizarStatusCaixaUI() {
            const aberto = localStorage.getItem(`caixa_aberto_${funcionarioLogado.id}`) === 'true';
            const badge = document.getElementById('badge-status-caixa');
            const btnAbrir = document.getElementById('btn-abrir-caixa');
            const btnFechar = document.getElementById('btn-fechar-caixa');

            if (aberto) {
                badge.className = 'badge-status status-aberto';
                badge.innerText = 'CAIXA ABERTO';
                btnAbrir.style.display = 'none';
                btnFechar.style.display = 'flex';
            } else {
                badge.className = 'badge-status status-fechado';
                badge.innerText = 'CAIXA FECHADO';
                btnAbrir.style.display = 'flex';
                btnFechar.style.display = 'none';
            }
        }

        // --- ESTOQUE EM TEMPO REAL COM SUPABASE ---
        async function carregarEstoqueFuncionario() {
            try {
                const { data, error } = await supabaseClient.from('estoque').select('*');
                if (error) throw error;

                const tbody = document.getElementById('lista-estoque-funcionario');
                tbody.innerHTML = '';
                if (data && data.length > 0) {
                    data.forEach(item => {
                        tbody.innerHTML += `
                            <tr>
                                <td>#${item.id}</td>
                                <td>${item.nome_produto}</td>
                                <td><span class="badge-blue">${item.quantidade_atual} un</span></td>
                                <td>R$ ${Number(item.preco_venda).toFixed(2)}</td>
                            </tr>`;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#a3b8cc;">Nenhum produto cadastrado no estoque.</td></tr>`;
                }
            } catch (e) {
                console.error('Erro ao carregar estoque:', e);
            }
        }

        // Assinar atualizações em tempo real do Supabase para o Estoque
        function configurarRealtimeEstoque() {
            supabaseClient
                .channel('public:estoque')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'estoque' }, payload => {
                    carregarEstoqueFuncionario();
                })
                .subscribe();
        }

        // Carregar produtos para o select do PDV
        async function carregarProdutosSelect() {
            try {
                const { data } = await supabaseClient.from('estoque').select('*');
                const select = document.getElementById('venda-produto');
                select.innerHTML = '<option value="">Selecione um produto</option>';
                if (data) {
                    data.forEach(p => {
                        if(p.quantidade_atual > 0) {
                            select.innerHTML += `<option value="${p.id}" data-preco="${p.preco_venda}" data-qtdmax="${p.quantidade_atual}">${p.nome_produto} (Disponível: ${p.quantidade_atual}) - R$ ${p.preco_venda}</option>`;
                        }
                    });
                }
            } catch (e) {
                console.error(e);
            }
        }

        // --- REALIZAR VENDA (PDV) ---
        async function realizarVendaFuncionario(event) {
            event.preventDefault();
            const produtoId = document.getElementById('venda-produto').value;
            const quantidadeVendida = parseInt(document.getElementById('venda-qtd').value);
            const formaPagamento = document.getElementById('venda-pagamento').value;

            if(!produtoId) {
                alert('Selecione um produto válido.');
                return;
            }

            try {
                // 1. Buscar dados atuais do produto para checar estoque e calcular valor
                const { data: prodData, error: prodError } = await supabaseClient
                    .from('estoque')
                    .select('*')
                    .eq('id', produtoId)
                    .single();

                if (prodError || !prodData) throw new Error('Produto não encontrado.');

                if (prodData.quantidade_atual < quantidadeVendida) {
                    alert(`Estoque insuficiente! Apenas ${prodData.quantidade_atual} unidades disponíveis.`);
                    return;
                }

                const valorTotal = Number(prodData.preco_venda) * quantidadeVendida;

                // 2. Dar baixa no estoque no Supabase
                const novaQuantidade = prodData.quantidade_atual - quantidadeVendida;
                const { error: updateError } = await supabaseClient
                    .from('estoque')
                    .update({ quantidade_atual: novaQuantidade })
                    .eq('id', produtoId);

                if (updateError) throw updateError;

                // 3. Registrar a venda na tabela de vendas vinculando o funcionário logado
                await supabaseClient.from('vendas').insert([{
                    funcionario_id: funcionarioLogado.id || null,
                    funcionario_nome: funcionarioLogado.nome || 'Colaborador',
                    forma_pagamento: formaPagamento,
                    subtotal: valorTotal,
                    valor_total: valorTotal,
                    data_venda: new Date()
                }]);

                alert(`Venda realizada com sucesso! Total: R$ ${valorTotal.toFixed(2)}`);
                fecharModalVenda();
                document.getElementById('form-venda-func').reset();
                
                // Atualizar caixas individuais
                carregarEstoqueFuncionario();
                atualizarValoresCaixa();

            } catch (err) {
                console.error(err);
                alert('Erro ao processar a venda. Tente novamente.');
            }
        }

        // --- ATUALIZAR VALORES DO CAIXA (DIA, SEMANA, MÊS) POR FUNCIONÁRIO ---
        async function atualizarValoresCaixa() {
            try {
                // Busca vendas filtradas pelo nome ou ID do funcionário logado
                const { data, error } = await supabaseClient
                    .from('vendas')
                    .select('valor_total, data_venda, funcionario_nome');

                if(!error && data) {
                    let hojeTotal = 0;
                    let semanaTotal = 0;
                    let mesTotal = 0;

                    const agora = new Date();
                    const hojeStr = agora.toISOString().split('T')[0];

                    data.forEach(v => {
                        // Filtra apenas as vendas feitas pelo funcionário logado atual para manter individualidade
                        if (v.funcionario_nome && v.funcionario_nome.toLowerCase() !== (funcionarioLogado.nome || '').toLowerCase()) {
                            return;
                        }

                        const dataVendaObj = new Date(v.data_venda);
                        const vendaStr = dataVendaObj.toISOString().split('T')[0];
                        const valor = Number(v.valor_total || 0);

                        // Hoje
                        if (vendaStr === hojeStr) {
                            hojeTotal += valor;
                        }

                        // Mês atual
                        if (dataVendaObj.getMonth() === agora.getMonth() && dataVendaObj.getFullYear() === agora.getFullYear()) {
                            mesTotal += valor;
                        }

                        // Semana (últimos 7 dias)
                        const diffTime = Math.abs(agora - dataVendaObj);
                        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                        if (diffDays <= 7) {
                            semanaTotal += valor;
                        }
                    });

                    document.getElementById('caixa-dia').innerText = `R$ ${hojeTotal.toFixed(2)}`;
                    document.getElementById('caixa-semana').innerText = `R$ ${semanaTotal.toFixed(2)}`;
                    document.getElementById('caixa-mes').innerText = `R$ ${mesTotal.toFixed(2)}`;
                }
            } catch (e) {
                console.error('Erro ao atualizar valores de caixa:', e);
            }
        }

        // Inicialização ao carregar a página
        window.addEventListener('DOMContentLoaded', () => {
            verificarSessao();
            atualizarStatusCaixaUI();
            carregarEstoqueFuncionario();
            configurarRealtimeEstoque();
            atualizarValoresCaixa();
        });
    </script>
</body>
</html>
