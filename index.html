<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Moura - Acesso Funcionário</title>
    <!-- Fontes e Ícones -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-dark: #071022; 
            --azul-primario: #0044cc;
            --azul-secundario: #001a4d;
            --amarelo-moura: #FFCC00;
            --amarelo-escuro: #ccaa00;
            --branco: #ffffff;
        }

        * { box-sizing: border-box; }

        body.login-bg {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--azul-secundario) 100%);
            color: var(--branco);
            min-height: 100vh;
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            padding: 20px;
        }

        /* Botão Flutuante Discreto e Moderno para Acesso Admin */
        .btn-flutuante-admin {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: var(--branco);
            padding: 10px 18px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            transition: all 0.3s ease;
            z-index: 100;
        }

        .btn-flutuante-admin:hover {
            background: rgba(255, 204, 0, 0.15);
            border-color: var(--amarelo-moura);
            color: var(--amarelo-moura);
            transform: translateY(-2px);
        }

        /* Estilos da Mini Janela Modal de Admin */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(2, 6, 23, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.ativo {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 204, 0, 0.25);
            border-radius: 24px;
            padding: 35px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
            transform: scale(0.9);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .modal-overlay.ativo .modal-card {
            transform: scale(1);
        }

        .btn-fechar-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            background: none;
            border: none;
            color: #a3b8cc;
            font-size: 20px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .btn-fechar-modal:hover {
            color: var(--amarelo-moura);
        }

        .login-container {
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: center;
            max-width: 950px;
            width: 100%;
            gap: 40px;
            z-index: 1;
        }

        .login-left {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .logo-destaque {
            max-width: 100%;
            width: 320px;
            filter: drop-shadow(0 15px 25px rgba(0, 0, 0, 0.5));
            animation: floatLogo 4s ease-in-out infinite;
        }

        @keyframes floatLogo {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }

        .login-right {
            flex: 1;
            display: flex;
            justify-content: center;
            width: 100%;
        }

        .card-flutuante {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 35px 30px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.4);
        }

        .login-header {
            text-align: center;
            margin-bottom: 25px;
        }

        .login-header h2 {
            margin: 0 0 5px 0;
            font-size: 24px;
            font-weight: 700;
        }

        .login-header p {
            margin: 0;
            color: #a3b8cc;
            font-size: 13px;
        }

        .input-group {
            position: relative;
            margin-bottom: 18px;
        }

        .input-group i {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #888;
            font-size: 16px;
        }

        .input-group:focus-within i {
            color: var(--amarelo-moura);
        }

        .input-3d {
            width: 100%;
            padding: 14px 14px 14px 45px;
            border-radius: 14px;
            border: none;
            background: rgba(0, 0, 0, 0.25);
            color: var(--branco);
            font-size: 15px;
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.5);
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
        }

        .input-3d:focus {
            outline: none;
            background: rgba(0, 0, 0, 0.4);
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.5), 0 0 0 2px var(--amarelo-moura);
        }

        .btn-3d {
            padding: 14px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-transform: uppercase;
        }

        .btn-amarelo {
            background: linear-gradient(to bottom, var(--amarelo-moura), #e6b800);
            color: var(--bg-dark);
            box-shadow: 0 5px 0 var(--amarelo-escuro), 0 12px 20px rgba(0,0,0,0.4);
        }

        @media (max-width: 768px) {
            .login-container { flex-direction: column; gap: 20px; }
            .logo-destaque { width: 180px; animation: none; }
        }
    </style>
</head>
<body class="login-bg">

    <!-- Botão Flutuante Discreto que ativa a Mini Janela Modal -->
    <button type="button" id="btnAbrirAdmin" class="btn-flutuante-admin">
        <i class="fas fa-shield-alt"></i> Acesso Admin
    </button>

    <!-- Mini Janela Modal de Login do Administrador -->
    <div id="modalAdmin" class="modal-overlay">
        <div class="modal-card">
            <button type="button" id="btnFecharAdmin" class="btn-fechar-modal">
                <i class="fas fa-times"></i>
            </button>
            <div class="login-header">
                <i class="fas fa-shield-halved" style="font-size: 2.2rem; color: var(--amarelo-moura); margin-bottom: 10px;"></i>
                <h2 style="color: var(--amarelo-moura);">Painel Master</h2>
                <p>Acesso restrito ao Administrador</p>
            </div>
            
            <form id="form-login-admin">
                <div class="input-group">
                    <i class="fas fa-envelope" style="color: var(--amarelo-moura);"></i>
                    <input type="email" id="email-admin" class="input-3d" placeholder="E-mail de Administrador" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-key" style="color: var(--amarelo-moura);"></i>
                    <input type="password" id="senha-admin" class="input-3d" placeholder="Senha Master" required>
                </div>
                <button type="submit" class="btn-3d btn-amarelo" style="width: 100%; margin-top: 10px;">
                    Acessar Sistema <i class="fas fa-lock-open"></i>
                </button>
            </form>
        </div>
    </div>

    <div class="login-container">
        <div class="login-left">
            <img src="assets/1000727343.png" alt="Logo Moura" class="logo-destaque">
        </div>

        <div class="login-right">
            <div class="card-flutuante">
                <div class="login-header">
                    <i class="fas fa-user-tie" style="font-size: 2rem; color: var(--amarelo-moura); margin-bottom: 10px;"></i>
                    <h2>Área do Funcionário</h2>
                    <p>Faça login para registrar operações</p>
                </div>
                
                <form id="form-login">
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" class="input-3d" placeholder="Seu e-mail" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-key"></i>
                        <input type="password" id="senha" class="input-3d" placeholder="Sua senha" required>
                    </div>
                    <button type="submit" class="btn-3d btn-amarelo" style="width: 100%; margin-top: 10px;">
                        Entrar <i class="fas fa-arrow-right"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- Scripts do Supabase e Lógica -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase.js"></script>
    <script src="js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Controle da Mini Janela (Modal)
            const btnAbrir = document.getElementById('btnAbrirAdmin');
            const btnFechar = document.getElementById('btnFecharAdmin');
            const modalAdmin = document.getElementById('modalAdmin');

            if (btnAbrir && modalAdmin) {
                btnAbrir.addEventListener('click', () => {
                    modalAdmin.classList.add('ativo');
                    document.getElementById('email-admin').focus();
                });
            }

            if (btnFechar && modalAdmin) {
                btnFechar.addEventListener('click', () => {
                    modalAdmin.classList.remove('ativo');
                });
            }

            // Fechar modal ao clicar fora da caixa
            window.addEventListener('click', (e) => {
                if (e.target === modalAdmin) {
                    modalAdmin.classList.remove('ativo');
                }
            });

            // Login do Funcionário
            const formLogin = document.getElementById('form-login');
            if (formLogin) {
                formLogin.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    const email = document.getElementById('email').value.trim();
                    const senha = document.getElementById('senha').value.trim();
                    await realizarLogin(email, senha, 'funcionario');
                });
            }

            // Login do Administrador via Mini Janela
            const formAdmin = document.getElementById('form-login-admin');
            if (formAdmin) {
                formAdmin.addEventListener('submit', async function(e) {
                    e.preventDefault();
                    const email = document.getElementById('email-admin').value.trim();
                    const senha = document.getElementById('senha-admin').value.trim();
                    await realizarLogin(email, senha, 'admin');
                });
            }
        });
    </script>
</body>
</html>
